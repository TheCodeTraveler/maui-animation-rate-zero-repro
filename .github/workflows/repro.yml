name: repro

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  rate-zero:
    name: managed legs (no device)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore tests
        run: dotnet restore tests

      - name: Build tests
        run: dotnet build tests --no-restore

      - name: Run bug, control and fix legs
        run: ./run-legs.sh

      - name: Assert every leg ran and matched
        if: always()
        run: |
          test -f results/summary.md || { echo "No summary: legs did not run"; exit 1; }
          test "$(grep -c '| OK |' results/summary.md)" -eq 3 || { echo "Expected 3 OK legs"; exit 1; }

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Animation rate 0 repro (Microsoft.Maui.Controls 11.0.10)"
            cat results/summary.md 2>/dev/null || echo "No results produced"
            echo
            echo "### Exception thrown by the bug leg"
            echo '```'
            cat results/bug-exception.txt 2>/dev/null || echo "No exception recorded"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: results
          path: results/

  android:
    name: android (API 36 emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Setup workload version
        id: dotnet-root
        shell: bash
        run: |
          p=$(dirname "$(readlink -f "$(command -v dotnet)")"); echo "path=$p" | tee -a "$GITHUB_OUTPUT"
          echo "sdk=$(dotnet --version)" | tee -a "$GITHUB_OUTPUT"
          wv=$(dotnet workload search version --take 1); test -n "$wv" || { echo '::error::No workload set found for this SDK band.'; exit 1; }; echo "workload-version=$wv" | tee -a "$GITHUB_OUTPUT"

      - name: Setup workload cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.dotnet-root.outputs.path }}/packs
            ${{ steps.dotnet-root.outputs.path }}/sdk-manifests
            ${{ steps.dotnet-root.outputs.path }}/metadata/workloads
            ${{ steps.dotnet-root.outputs.path }}/template-packs
          key: dotnet-workload-maui-android-${{ runner.os }}-${{ runner.arch }}-${{ steps.dotnet-root.outputs.sdk }}-${{ steps.dotnet-root.outputs.workload-version }}

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android --version ${{ steps.dotnet-root.outputs.workload-version }}

      - name: Build the app (Release, one APK for both cells)
        run: dotnet build app/C04Repro/C04Repro.csproj -c Release

      - name: Setup KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm --settle
          if ! { test -r /dev/kvm && test -w /dev/kvm; }; then
            echo '::error::/dev/kvm is not usable, so the Android emulator cannot use hardware acceleration.'
            exit 1
          fi

      # Animations stay ON: with animator_duration_scale 0, MAUI skips every animation and the bug cannot show
      - name: Run the cells on an emulator
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          cores: 4
          ram-size: 4096M
          disk-size: 6000M
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: bash ci/run-cells.sh

      - name: Assert every cell and write the summary
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/android
          set +e
          bash ci/assert-cells.sh artifacts/android | tee artifacts/android/summary.md
          code=${PIPESTATUS[0]}
          {
            echo "## Android API 36 emulator (animations on)"
            echo
            cat artifacts/android/summary.md
            echo
            echo "### Bug cell: crash buffer"
            echo '```'
            head -c 6000 artifacts/android/bug/crash.txt 2>/dev/null || echo "No crash log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: results-android
          path: artifacts/android
          if-no-files-found: warn
